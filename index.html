<script>
  function analyzeSequence() {
    let input = document.getElementById('sequence').value.trim();
    if (!input) return alert("Please enter a DNA sequence.");

    // Remove FASTA header lines starting with '>'
    let lines = input.split('\n').filter(line => !line.trim().startsWith('>'));
    let raw = lines.join('').toUpperCase().replace(/[^A-Z]/g, '');

    if (!raw) return alert("No valid sequence data found.");

    // Extract core ATCG nucleotides plus IUPAC degenerate codes
    const validDna = raw.replace(/[^ATCGRYSWKMBDHVN]/g, '');
    const len = validDna.length;

    // Calculate GC content (counting G, C, and S which represents G or C)
    const gcCount = (validDna.match(/[GCS]/g) || []).length;
    const gc = len > 0 ? ((gcCount / len) * 100).toFixed(2) : "0.00";

    // Standard + IUPAC Degenerate Complement Map
    const compMap = {
      'A':'T', 'T':'A', 'C':'G', 'G':'C',
      'R':'Y', 'Y':'R', 'S':'S', 'W':'W',
      'K':'M', 'M':'K', 'B':'V', 'V':'B',
      'D':'H', 'H':'D', 'N':'N'
    };

    const comp = validDna.split('').map(b => compMap[b] || 'N').join('');

    // Update UI
    document.getElementById('len').innerText = len;
    document.getElementById('gc').innerText = gc;
    document.getElementById('comp').innerText = comp;
    document.getElementById('output').style.display = 'block';
  }
</script>
