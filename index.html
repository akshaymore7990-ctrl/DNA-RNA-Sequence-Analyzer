<script>
  function analyzeSequence() {
    let input = document.getElementById('sequence').value.trim();
    if (!input) return alert("Please enter a DNA sequence.");

    // 1. Properly strip out FASTA header lines (lines starting with '>')
    let lines = input.split('\n');
    let sequenceLines = lines.filter(line => !line.trim().startsWith('>'));
    let raw = sequenceLines.join('').toUpperCase().replace(/\s+/g, '');

    // 2. Filter out non-IUPAC nucleotide characters
    const validDna = raw.replace(/[^ATCGRYSWKMBDHVN]/g, '');
    if (!validDna) return alert("No valid sequence data found.");

    const len = validDna.length;

    // 3. Accurate GC Content (counts G, C, and IUPAC degenerate 'S' for Strong G/C)
    const gcCount = (validDna.match(/[GCS]/g) || []).length;
    const gc = ((gcCount / len) * 100).toFixed(2);

    // 4. Complement Mapping
    const compMap = {
      'A':'T', 'T':'A', 'C':'G', 'G':'C',
      'R':'Y', 'Y':'R', 'S':'S', 'W':'W',
      'K':'M', 'M':'K', 'B':'V', 'V':'B',
      'D':'H', 'H':'D', 'N':'N'
    };

    const comp = validDna.split('').map(b => compMap[b] || 'N').join('');

    // Update UI elements
    document.getElementById('len').innerText = len;
    document.getElementById('gc').innerText = gc;
    document.getElementById('comp').innerText = comp;
    document.getElementById('output').style.display = 'block';
  }
</script>
